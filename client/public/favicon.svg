<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />

  <!-- Outer soundwaves -->
  <path d="M 106 190 A 150 150 0 0 0 106 322" fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <path d="M 406 190 A 150 150 0 0 1 406 322" fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85" />

  <!-- Inner soundwaves -->
  <path d="M 146 216 A 100 100 0 0 0 146 296" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 366 216 A 100 100 0 0 1 366 296" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Microphone capsule -->
  <rect x="220" y="150" width="72" height="130" rx="36" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Microphone stand arch -->
  <path d="M 196 220 A 60 60 0 0 0 316 220" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />

  <!-- Microphone stem & base -->
  <line x1="256" y1="280" x2="256" y2="330" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
  <line x1="210" y1="330" x2="302" y2="330" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
</svg>