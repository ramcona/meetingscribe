<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetingScribe</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0A0A0B;
        color: #F3F4F6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 99999;
      }
      #splash-screen .splash-logo-container {
        position: relative;
        margin-bottom: 20px;
      }
      #splash-screen .splash-logo-glow {
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(99, 102, 241, 0) 70%);
        border-radius: 28px;
        filter: blur(12px);
        animation: pulse-glow 2s ease-in-out infinite alternate;
      }
      #splash-screen .splash-logo {
        position: relative;
        width: 68px;
        height: 68px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        object-fit: cover;
      }
      #splash-screen .splash-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #FFFFFF;
        margin-bottom: 4px;
      }
      #splash-screen .splash-tagline {
        font-size: 10.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #818CF8;
        font-weight: 600;
        margin-bottom: 26px;
      }
      #splash-screen .splash-loader-bar {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      #splash-screen .splash-loader-progress {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;
        background: linear-gradient(90deg, #6366F1, #A855F7);
        border-radius: 9999px;
        animation: splash-loading 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-loading {
        0% { left: -50%; width: 30%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
      @keyframes pulse-glow {
        0% { opacity: 0.35; transform: scale(0.95); }
        100% { opacity: 0.85; transform: scale(1.08); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-screen">
        <div class="splash-logo-container">
          <div class="splash-logo-glow"></div>
          <img src="/icon.png" alt="MeetingScribe" class="splash-logo" />
        </div>
        <div class="splash-title">MeetingScribe</div>
        <div class="splash-tagline">Meeting Recorder &amp; Notes</div>
        <div class="splash-loader-bar">
          <div class="splash-loader-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
